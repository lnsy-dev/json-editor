<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project</title>
  <script type="module" src="/main.min.js"></script>
  <style>
    :root {
      --primary-hue: 27; /* Original primary hue */  
      --saturation: 100%;  
      --lightness: 50%; 

      /* json-editor demo theme */
      --background-color: #dddbc7;
      --foreground-color: #2d2d2d;
      --highlight-color: #b3d9b6;
      --secondary-color: #ede9d7;
      --trinary-color: #8aa38a;
      --quaternary-color: #d4cfbd;
      --confirmation-color: #0a5c0a;
      --notification-color: #377c43;
      --inactive-color: #cccccc;
      --warning-color: #639e71;
      --error-color: #ff6b6b;
      --neutral-color: #1c3320;
    }

    body {
      max-width: 60em;
      margin: auto;
    }

    p {
      color: var(--tertiary-fg-color);
    }

    a {
      color: var(--secondary-fg-color);
    }

    h1, h2, h3 {
      color: var(--complementary-color);
    }

    .test-controls {
      margin: 2em 0;
      padding: 1em;
      border: 2px solid #ddd;
      border-radius: 8px;
    }

    .test-controls h2 {
      margin-top: 0;
    }

    .test-controls button {
      margin: 0.5em 0.5em 0.5em 0;
      padding: 0.5em 1em;
      font-size: 1em;
      cursor: pointer;
      border: 1px solid #333;
      border-radius: 4px;
      background: white;
    }

    .test-controls button:hover {
      background: #f0f0f0;
    }

    .test-controls textarea {
      width: 100%;
      min-height: 200px;
      font-family: monospace;
      padding: 0.5em;
      box-sizing: border-box;
      margin-top: 0.5em;
    }
  </style>
</head>
<body>

  <div class="test-controls">
    <h2>YAML/JSON Converter Test</h2>
    
    <div>
      <button id="load-json-btn">Load Sample JSON</button>
      <button id="load-json-interact-only-btn">Load Sample JSON (Interact-Only)</button>
      <button id="load-json-read-only-btn">Load Sample JSON (Read-Only)</button>
      <button id="allow-editing-btn">Allow Editing</button>
      <button id="load-yaml-btn">Load Sample YAML</button>
      <button id="load-dropdown-btn">Load Dropdown Example</button>
      <button id="load-fuzzy-btn">Load Fuzzy Search Example</button>
      <button id="load-coordinates-btn">Load Coordinates Example</button>
      <button id="get-json-btn">Get as JSON</button>
      <button id="get-json-schema-btn">Get as JSON with Schema</button>
      <button id="get-yaml-btn">Get as YAML</button>
      <button id="clear-btn">Clear Output</button>
    </div>

    <textarea id="output" placeholder="Output will appear here..."></textarea>
  </div>

  <json-editor></json-editor>

  <script type="module">
    const editor = document.querySelector('json-editor');
    const output = document.getElementById('output');

    // Sample JSON data
    const sampleJSON = `{
  "name": "John Doe",
  "age": 30,
  "email": "john@example.com",
  "tags": ["developer", "designer"],
  "isActive": true,
  "salary": 75000.50
}`;

    // Sample YAML data
    const sampleYAML = `name: Jane Smith
age: 28
email: jane@example.com
tags:
  - manager
  - analyst
isActive: true
salary: 85000.75`;

    // Dropdown example schema JSON
    const dropdownJSON = `[
  { "key": "name", "type": "string", "value": "Task" },
  { "key": "status", "type": "dropdown", "value": "active", "optionsUrl": "examples/dropdown-options.json" }
]`;

    // Fuzzy search example schema JSON
    const fuzzyJSON = `[
  { "key": "name", "type": "string", "value": "Task" },
  { "key": "related files", "type": "fuzzy search", "value": ["[[Project Overview]]"], "optionsUrl": "examples/fuzzy-files.json", "endpoint": "/api/fuzzy-search" },
  { "key": "labels", "type": "fuzzy tag search", "value": ["design"], "optionsUrl": "examples/dropdown-options.json" }
]`;

    // Coordinates example JSON
    const coordinatesJSON = `{
  "origin": { "x": 0, "y": 0, "z": 0 },
  "sensor": { "x": 12.5, "y": -3.25, "z": 7.8 },
  "gps": { "latitude": 40.7128, "longitude": -74.006, "altitude": 10 }
}`;

    // Load sample JSON
    document.getElementById('load-json-btn').addEventListener('click', () => {
      const success = editor.setJSON(sampleJSON);
      output.value = success ? 'JSON loaded successfully!' : 'Failed to load JSON';
    });

    // Load sample JSON in interact-only mode (no add/delete)
    document.getElementById('load-json-interact-only-btn').addEventListener('click', () => {
      const success = editor.setJSON(sampleJSON);
      editor.removeAttribute('read-only');
      editor.setAttribute('interact-only', '');
      output.value = success ? 'JSON loaded in interact-only mode!' : 'Failed to load JSON';
    });

    // Load sample JSON in read-only mode (no interaction)
    document.getElementById('load-json-read-only-btn').addEventListener('click', () => {
      const success = editor.setJSON(sampleJSON);
      editor.removeAttribute('interact-only');
      editor.setAttribute('read-only', '');
      output.value = success ? 'JSON loaded in read-only mode!' : 'Failed to load JSON';
    });

    // Allow full editing again
    document.getElementById('allow-editing-btn').addEventListener('click', () => {
      editor.removeAttribute('interact-only');
      editor.removeAttribute('read-only');
      output.value = 'Full editing is now allowed.';
    });

    // Load sample YAML
    document.getElementById('load-yaml-btn').addEventListener('click', () => {
      const success = editor.setYaml(sampleYAML);
      output.value = success ? 'YAML loaded successfully!' : 'Failed to load YAML';
    });

    // Load dropdown example
    document.getElementById('load-dropdown-btn').addEventListener('click', () => {
      const success = editor.setJSON(dropdownJSON);
      output.value = success ? 'Dropdown example loaded successfully!' : 'Failed to load dropdown example';
    });

    // Load fuzzy search example
    document.getElementById('load-fuzzy-btn').addEventListener('click', () => {
      const success = editor.setJSON(fuzzyJSON);
      output.value = success ? 'Fuzzy search example loaded successfully!' : 'Failed to load fuzzy search example';
    });

    // Load coordinates example
    document.getElementById('load-coordinates-btn').addEventListener('click', () => {
      const success = editor.setJSON(coordinatesJSON);
      output.value = success ? 'Coordinates example loaded successfully!' : 'Failed to load coordinates example';
    });

    // Get current data as JSON
    document.getElementById('get-json-btn').addEventListener('click', () => {
      const json = editor.getJSON();
      output.value = json;
    });

    // Get current data as JSON with Schema
    document.getElementById('get-json-schema-btn').addEventListener('click', () => {
      const data = editor.exportJSONWithSchema();
      output.value = JSON.stringify(data, null, 2);
    });

    // Get current data as YAML
    document.getElementById('get-yaml-btn').addEventListener('click', () => {
      const yaml = editor.getYaml();
      output.value = yaml;
    });

    // Clear output
    document.getElementById('clear-btn').addEventListener('click', () => {
      output.value = '';
    });
  </script>

</body>
</html>
